<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Recommender</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/env.js"></script>
    <script src="js/script.js" defer></script>
  </head>
  <body>
    <h1>🎬 Movie Filmmakers</h1>

    <div class="row">
      <p>
        <a id="shawshank-btn" href="#" class="btn btn-primary my-2"
          >Shawshank Redemption</a
        >
        <a id="godfather-btn" href="#" class="btn btn-secondary my-2"
          >The GodFather</a
        >
        <a id="knight-btn" href="#" class="btn btn-info my-2"
          >The Dark Knight</a
        >
        <a id="godfatherII-btn" href="#" class="btn btn-secondary my-2"
          >The GodFather Part II</a
        >
        <a id="men-btn" href="#" class="btn btn-secondary my-2">12 Angry Men</a>
        <a id="lord-btn" href="#" class="btn btn-secondary my-2"
          >The Lord of the Rings : The Return of the King</a
        >
        <a id="schindler-btn" href="#" class="btn btn-secondary my-2"
          >Schindler's List</a
        >
        <a id="fellowship-btn" href="#" class="btn btn-secondary my-2"
          >The Lord of the Rings : The Fellowship of the Ring</a
        >
        <a id="pulp-btn" href="#" class="btn btn-secondary my-2"
          >Pulp Fiction</a
        >
        <a id="good-btn" href="#" class="btn btn-secondary my-2"
          >The Good, the Bad and the Ugly</a
        >
      </p>
    </div>
    <div class="row">
      <div class="col">
        <ul class="list-group">
          <li class="list-group-item">
            <div class="movie-names">Filmmakers Displayed Here</div>
          </li>
        </ul>
      </div>
    </div>
  </body>
</html>
